name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - run: pyright
      - run: pyrefly check
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - name: Install the wheel away from the checkout
        run: |
          python -m venv /tmp/uvr-wheel
          /tmp/uvr-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/uvr-wheel/bin/python -c "import asyncio; from uvr_maestro.server import mcp, uvr_status; from uvr_maestro.registry import Registry; assert len(Registry.load_bundled().all()) == 104; assert len(asyncio.run(mcp.list_tools())) == 34; assert uvr_status()['success']"
          /tmp/uvr-wheel/bin/uvr-maestro-setup --runtime-root /tmp/not-written
      - name: Check the extracted sdist
        run: |
          mkdir /tmp/uvr-sdist
          tar xzf dist/*.tar.gz -C /tmp/uvr-sdist --strip-components=1
          /tmp/uvr-wheel/bin/pip install -e "/tmp/uvr-sdist[dev]"
          cd /tmp/uvr-sdist
          /tmp/uvr-wheel/bin/pytest -q
